<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body{
            background-color:#1fc8ff;
          margin: 0;
          min-height: 100vh;
          display:flex; 
          justify-content:center;
          align-items: center; 
        }
        .todo{
 padding: 30px 30px 15px 30px;  /* top right bottom left */
            text-align: center;
            width: 400px;
            background-color:white;
      border-radius: 24px ; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background:linear-gradient(135deg, white, white);
        }
        .todo h1 {
    font-family: Arial, sans-serif;
    font-size: 36px;
    font-weight: 800;      /* bold — 700-900 range makes text heavier */
    color: #1e2a4a;        /* dark navy */
    margin-bottom: 5px;
}



 .todo input {
     padding: 12px 16px;  /* upar-neeche 12px, left-right 16px space */
    border-radius: 8px;
    border: 1px solid #ccc;
}

.todo button {
    color:white;
    font-weight:bold;
    padding: 12px 24px;
    border-radius: 8px;
    background-color: #1fc8ff;
}
       #cityInput {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid #dfe6e9;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
 
#cityInput:focus {
  border-color: #4facfe;
}
 
#searchBtn {
  padding: 10px 18px;
  border: none;
  background: #4facfe;
  color: #fff;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: background 0.2s;
}
 
#searchBtn:hover {
  background: #2f9bfa;
}
 
.error {
  color: #e74c3c;
  font-size: 14px;
  margin-top: 10px;
}
 
.hidden {
  display: none !important;
}
 
.weather-card {
  margin-top: 20px;
  animation: fadeIn 0.4s ease;
}
 
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
 
#cityName {
  font-size: 22px;
  color: #2c3e50;
}
 
#dateTime {
  font-size: 13px;
  color: #7f8c8d;
  margin-bottom: 5px;
}
 
#weatherIcon {
  width: 100px;
  height: 100px;
}
 
.temp {
  font-size: 42px;
  font-weight: 700;
  color: #2c3e50;
}
 
#description {
  text-transform: capitalize;
  color: #636e72;
  margin-bottom: 15px;
  font-size: 15px;
}
 
.details {
  display: flex;
  justify-content: space-between;
  background: #f1f7ff;
  border-radius: 12px;
  padding: 14px;
}
 
.details div {
  flex: 1;
}
 
.details span {
  font-size: 12px;
  color: #7f8c8d;
  display: block;
  margin-bottom: 4px;
}
 
.details p {
  font-size: 15px;
  font-weight: 600;
  color: #2c3e50;
}
 
.loader {
  margin: 20px auto 0;
  width: 30px;
  height: 30px;
  border: 4px solid #dfe6e9;
  border-top: 4px solid #4facfe;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
 
@keyframes spin {
  to { transform: rotate(360deg); }
} 


        
    </style>
</head>
<body>
    
    
    <div class="todo">
        <h1>Weather App</h1>
    <input type="text" id="cityInput" placeholder="Enter city name...">
    <button id="searchBtn">Add</button>
<p id="errorMsg" class="error hidden"></p>
<div id="weatherCard" class="weather-card hidden">
      <h2 id="cityName"></h2>
      <p id="dateTime"></p>
      <img id="weatherIcon" src="" alt="weather icon">
      <p id="temperature" class="temp"></p>
      <p id="description"></p>

      <div class="details">
        <div>
          <span>Feels Like</span>
          <p id="feelsLike"></p>
        </div>
        <div>
          <span>Humidity</span>
          <p id="humidity"></p>
        </div>
        <div>
          <span>Wind Speed</span>
          <p id="wind"></p>
        </div>
      </div>
    </div>

    <div id="loader" class="loader hidden"></div>
  </div>
    </div>
    <script>
        
const API_KEY = "e6e935557e6db59bb4429a22d15dcf36";

const cityInput = document.getElementById("cityInput");
const searchBtn = document.getElementById("searchBtn");
const weatherCard = document.getElementById("weatherCard");
const errorMsg = document.getElementById("errorMsg");
const loader = document.getElementById("loader");

const cityName = document.getElementById("cityName");
const dateTime = document.getElementById("dateTime");
const weatherIcon = document.getElementById("weatherIcon");
const temperature = document.getElementById("temperature");
const description = document.getElementById("description");
const feelsLike = document.getElementById("feelsLike");
const humidity = document.getElementById("humidity");
const wind = document.getElementById("wind");

// Button click aur Enter key dono se search chale
searchBtn.addEventListener("click", handleSearch);
cityInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleSearch();
});

function handleSearch() {
  const city = cityInput.value.trim();
  if (!city) {
    showError("Please enter a city name.");
    return;
  }
  getWeather(city);
}

async function getWeather(city) {
  hideError();
  weatherCard.classList.add("hidden");
  loader.classList.remove("hidden");

  const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(
    city
  )}&appid=${API_KEY}&units=metric`;

  try {
    const response = await fetch(url);

    // agar city nahi mili ya API key galat hai
    if (!response.ok) {
      throw new Error(
        response.status === 404 ? "City not found." : "Something went wrong."
      );
    }

    const data = await response.json();
    displayWeather(data);
  } catch (err) {
    showError(err.message);
  } finally {
    loader.classList.add("hidden");
  }
}

function displayWeather(data) {
  cityName.textContent = `${data.name}, ${data.sys.country}`;
  dateTime.textContent = new Date().toLocaleString();

  const iconCode = data.weather[0].icon;
  weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

  temperature.textContent = `${Math.round(data.main.temp)}°C`;
  description.textContent = data.weather[0].description;

  feelsLike.textContent = `${Math.round(data.main.feels_like)}°C`;
  humidity.textContent = `${data.main.humidity}%`;
  wind.textContent = `${data.wind.speed} m/s`;

  weatherCard.classList.remove("hidden");
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.remove("hidden");
}

function hideError() {
  errorMsg.classList.add("hidden");
}

    </script>
 


</body>
</html>
